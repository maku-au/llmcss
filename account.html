<!DOCTYPE html>
<html lang="en" data-ai-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account | LLMCSS</title>
  <meta name="description" content="LLMCSS Pro is a $9/month Polar subscription. Your license token is shown once after checkout." />
  <meta property="og:title" content="Account | LLMCSS" />
  <meta property="og:description" content="Manage your LLMCSS Pro license token." />
  <meta property="og:url" content="https://llmcss.io/account" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://llmcss.io/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://llmcss.io/og.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/index.css" />
  <script>
    (function () {
      var t = localStorage.getItem('cssai-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-ai-theme', t);
      var f = localStorage.getItem('cssai-focus');
      if (f && f !== 'accent') document.documentElement.setAttribute('data-ai-focus', f);
    })();
  </script>
</head>
<body>
  <a class="ai-skip-link" href="#main">Skip to content</a>
  <header id="site-header" class="ai-navbar"></header>
  <main id="main" class="ai-container" style="max-width: 40rem; padding: var(--ai-space-16) var(--ai-space-4) var(--ai-space-24);">
    <h1>Your license</h1>
    <p class="ai-text-secondary" style="margin-top: var(--ai-space-2);">
      Pro is a <strong>$9/month</strong> Polar subscription. The key is shown once after payment. Refunds follow
      <a href="https://polar.sh">Polar</a> policy. Questions: webmaster@llmcss.io
    </p>

    <div id="status-box" class="ai-card" style="padding: var(--ai-space-6); margin-top: var(--ai-space-8); display: none;"></div>
    <div id="reveal-box" class="ai-card" style="padding: var(--ai-space-6); margin-top: var(--ai-space-6); display: none;"></div>

    <div class="ai-card" style="padding: var(--ai-space-6); margin-top: var(--ai-space-6);">
      <h2 class="ai-card-title">Paste a token</h2>
      <form id="validate-form" class="ai-flex ai-flex-col ai-gap-3" style="margin-top: var(--ai-space-4);">
        <input id="token-input" class="ai-input" type="text" autocomplete="off" placeholder="llmcss_live_..." />
        <button class="ai-btn ai-btn-primary" type="submit" id="validate-btn">Validate</button>
      </form>
      <p id="validate-out" class="ai-text-sm" style="margin-top: var(--ai-space-3);"></p>
    </div>

    <div class="ai-card" style="padding: var(--ai-space-6); margin-top: var(--ai-space-6);">
      <h2 class="ai-card-title">Use it</h2>
      <p class="ai-text-sm ai-text-secondary" style="margin-top: var(--ai-space-2);">Unlock Pro in the <a href="/components.html">gallery</a>, or in the CLI:</p>
      <pre style="margin-top: var(--ai-space-3); font-size: 0.8125rem; overflow-x: auto;"><code>npx llmcss login &lt;token&gt;
npx llmcss add tool-trace</code></pre>
    </div>
  </main>
  <footer id="site-footer" class="ai-footer ai-footer-compact"></footer>
  <script type="module" src="/src/showcase/account.ts"></script>
</body>
</html>
