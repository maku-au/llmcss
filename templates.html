<!DOCTYPE html>
<html lang="en" data-ai-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Templates | LLMCSS</title>
  <meta name="description" content="Wireframe sections and page blueprints built from LLMCSS primitives." />
  <meta property="og:title" content="Templates | LLMCSS" />
  <meta property="og:description" content="Wireframe sections and page blueprints built from LLMCSS primitives." />
  <meta property="og:url" content="https://llmcss.io/templates.html" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://llmcss.io/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://llmcss.io/og.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/index.css" />
  <script>
    (function () {
      var t = localStorage.getItem('cssai-theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-ai-theme', t);
      var f = localStorage.getItem('cssai-focus');
      if (f && f !== 'accent') document.documentElement.setAttribute('data-ai-focus', f);
    })();
  </script>
</head>
<body id="top">
  <a class="ai-skip-link" href="#main">Skip to content</a>
  <header id="site-header" class="ai-navbar"></header>
  <main id="main">


  <!-- ==========================================================================
       HERO & BLUEPRINTS RECIPES BAR
       ========================================================================== -->
  <section class="ai-docs-hero-compact">
    <div class="ai-container" style="max-width: 1440px;">
      <div class="ai-flex ai-justify-between ai-items-end ai-flex-wrap ai-gap-6">
        <div>
          <h1 class="ai-font-display" style="font-size: clamp(1.75rem, 3.5vw, 2.25rem); font-weight: 700; letter-spacing: -0.03em;">
            Templates
          </h1>
          <p class="ai-text-secondary ai-text-sm" style="margin-top: 0.25rem;">
            Section wireframes plus four page recipes you can copy as one file.
          </p>
        </div>
      </div>

      <div class="ai-blueprint-bar-track" id="blueprint-bar" style="margin-top: var(--ai-space-5);"></div>
      <div id="blueprint-banner" style="display: none;"></div>
    </div>
  </section>

  <!-- ==========================================================================
       STICKY TOOLBAR & CATEGORY NAV
       ========================================================================== -->
  <nav class="ai-docs-toolbar" aria-label="Section Categories">
    <div class="ai-container ai-flex ai-flex-wrap ai-items-center ai-justify-between ai-gap-4" style="max-width: 1440px;">
      <div class="ai-flex ai-items-center ai-gap-1 ai-min-w-0" id="category-nav" style="overflow-x: auto; flex: 1 1 20rem;">
        <button class="ai-docs-filter-btn is-active" data-category="all">All</button>
        <button class="ai-docs-filter-btn" data-category="header">Headers</button>
        <button class="ai-docs-filter-btn" data-category="hero">Heroes</button>
        <button class="ai-docs-filter-btn" data-category="features">Features</button>
        <button class="ai-docs-filter-btn" data-category="social-proof">Social proof</button>
        <button class="ai-docs-filter-btn" data-category="comparison">Comparison</button>
        <button class="ai-docs-filter-btn" data-category="pricing">Pricing</button>
        <button class="ai-docs-filter-btn" data-category="faq">FAQ</button>
        <button class="ai-docs-filter-btn" data-category="cta">CTA</button>
        <button class="ai-docs-filter-btn" data-category="footer">Footer</button>
        <button class="ai-docs-filter-btn" data-category="app-shell">App shell</button>
      </div>
      <div class="ai-flex ai-items-center ai-gap-3" style="flex-shrink: 0;">
        <div class="ai-segmented">
          <button class="ai-segmented-btn preview-mode-btn is-active" data-mode="wireframe">Wireframe</button>
          <button class="ai-segmented-btn preview-mode-btn" data-mode="themed">Themed</button>
        </div>
        <div class="ai-segmented">
          <button class="ai-segmented-btn viewport-btn is-active" data-viewport="100%">Full</button>
          <button class="ai-segmented-btn viewport-btn" data-viewport="768px">768</button>
          <button class="ai-segmented-btn viewport-btn" data-viewport="375px">375</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ==========================================================================
       MAIN CONTENT: TEMPLATES STREAM
       ========================================================================== -->
  <section class="ai-section" style="padding: var(--ai-space-8) 0 var(--ai-space-24);">
    <div class="ai-container" style="max-width: 1440px;">
      <div id="templates-stream">
        <!-- Rendered dynamically by templates.ts -->
      </div>
    </div>
  </section>

  <!-- ==========================================================================
       FULL BLUEPRINT ASSEMBLED PREVIEW MODAL
       ========================================================================== -->
  <div class="ai-blueprint-modal" id="blueprint-preview-modal" role="dialog" aria-modal="true" aria-labelledby="blueprint-preview-title">
    <div class="ai-blueprint-modal-dialog">
      <div class="ai-blueprint-modal-header">
        <div class="ai-flex ai-items-center ai-gap-3">
          <h3 id="blueprint-preview-title" style="font-family: var(--ai-font-display); font-size: 1.125rem; font-weight: 700; margin: 0;">
            Preview full page
          </h3>
        </div>
        <div class="ai-flex ai-items-center ai-gap-2">
          <button type="button" class="ai-btn ai-btn-outline ai-btn-xs" id="copy-preview-html">Copy page HTML</button>
          <button class="ai-btn ai-btn-ghost ai-btn-xs" data-dismiss="modal" aria-label="Close preview">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
            <span>Close</span>
          </button>
        </div>
      </div>
      <div class="ai-blueprint-modal-body" id="blueprint-preview-content">
        <!-- Live assembled markup rendered here -->
      </div>
    </div>
  </div>

  

  <!-- ==========================================================================
       CORE STYLER DRAWER (UNBLURRED LIVE INSPECTOR)
       ========================================================================== -->
    </main>
  <footer id="site-footer" class="ai-footer ai-footer-compact"></footer>

<div class="ai-drawer ai-drawer-no-lock" id="core-styler-drawer" aria-hidden="true">
    <div class="ai-drawer-backdrop" data-ai-dismiss="drawer"></div>
    <div class="ai-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="styler-drawer-title">
      <div class="ai-drawer-header" style="padding: var(--ai-space-4) var(--ai-space-6); border-bottom: 1px solid var(--ai-border-subtle); display: flex; justify-content: space-between; align-items: center;">
        <div class="ai-flex ai-items-center ai-gap-2">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <h3 id="styler-drawer-title" style="font-family: var(--ai-font-display); font-size: 0.9375rem; font-weight: 700; margin: 0;">LLMCSS Styler</h3>
        </div>
        <button class="ai-btn ai-btn-ghost ai-btn-xs" data-ai-dismiss="drawer" aria-label="Close Styler">&times;</button>
      </div>

      <div class="ai-drawer-body" style="padding: var(--ai-space-6); display: flex; flex-direction: column; gap: var(--ai-space-6); overflow-y: auto;">
        <!-- Theme Palette -->
        <div class="ai-styler-section">
          <div class="ai-styler-section-header">
            <span class="ai-styler-section-title">Production Theme</span>
            <span class="ai-styler-section-val" id="styler-skin-label">Modern Studio</span>
          </div>
          <div class="ai-styler-theme-grid">
            <button class="ai-styler-theme-btn is-active" data-skin="modern">
              <span class="ai-styler-theme-swatch" style="background: #2563eb;"></span>
              <span>Modern</span>
            </button>
            <button class="ai-styler-theme-btn" data-skin="obsidian">
              <span class="ai-styler-theme-swatch" style="background: #6366f1;"></span>
              <span>Obsidian</span>
            </button>
            <button class="ai-styler-theme-btn" data-skin="executive">
              <span class="ai-styler-theme-swatch" style="background: #0f172a;"></span>
              <span>Executive</span>
            </button>
            <button class="ai-styler-theme-btn" data-skin="fintech">
              <span class="ai-styler-theme-swatch" style="background: #0d9488;"></span>
              <span>Fintech</span>
            </button>
            <button class="ai-styler-theme-btn" data-skin="editorial">
              <span class="ai-styler-theme-swatch" style="background: #b45309;"></span>
              <span>Editorial</span>
            </button>
            <button class="ai-styler-theme-btn" data-skin="enterprise">
              <span class="ai-styler-theme-swatch" style="background: #1e40af;"></span>
              <span>Enterprise</span>
            </button>
          </div>
        </div>

        <div class="ai-styler-section">
          <div class="ai-styler-section-header">
            <span class="ai-styler-section-title">Title font</span>
            <span class="ai-styler-section-val">One face for headings</span>
          </div>
          <select id="styler-font-switcher" class="ai-select" style="width: 100%; height: 2rem; font-size: 0.8125rem;" aria-label="Title font"></select>
        </div>

        <!-- Geometry -->
        <div class="ai-styler-section">
          <div class="ai-styler-section-header">
            <span class="ai-styler-section-title">Corner Geometry</span>
            <span class="ai-styler-section-val">Balanced (4-8px)</span>
          </div>
          <div class="ai-styler-segmented-track">
            <button class="ai-styler-segmented-item" data-radius="sharp">Sharp</button>
            <button class="ai-styler-segmented-item" data-radius="precision">Precision</button>
            <button class="ai-styler-segmented-item is-active" data-radius="balanced">Balanced</button>
            <button class="ai-styler-segmented-item" data-radius="smooth">Smooth</button>
          </div>
        </div>

        <!-- Focus ring -->
        <div class="ai-styler-section">
          <div class="ai-styler-section-header">
            <span class="ai-styler-section-title">Focus ring</span>
            <span class="ai-styler-section-val" id="styler-focus-label">Accent</span>
          </div>
          <div class="ai-styler-segmented-track">
            <button class="ai-styler-segmented-item ai-styler-focus-btn is-active" data-focus="accent">Accent</button>
            <button class="ai-styler-segmented-item ai-styler-focus-btn" data-focus="neutral">Neutral</button>
            <button class="ai-styler-segmented-item ai-styler-focus-btn" data-focus="thin">Thin</button>
            <button class="ai-styler-segmented-item ai-styler-focus-btn" data-focus="none">Off</button>
          </div>
        </div>

      </div>

      <div class="ai-drawer-footer" style="padding: var(--ai-space-4) var(--ai-space-6); border-top: 1px solid var(--ai-border-subtle); display: flex; justify-content: space-between; align-items: center; background: var(--ai-surface-1);">
        <button class="ai-btn ai-btn-primary ai-btn-xs" data-ai-dismiss="drawer">Done</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="ai-toast-container" id="toast-container"></div>

  <!-- Entry Script -->
  <script type="module" src="/src/showcase/templates.ts"></script>
</body>
</html>
